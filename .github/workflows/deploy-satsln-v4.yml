name: Deploy satsln-v4

# Deploys main to https://pesats.ksdae.kehutanan.go.id/satsln-v4 via the self-hosted
# runner on 172.16.3.40 (label "satsln-v4"), which updates /www/wwwroot/pesats-v4.local in place.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-satsln-v4
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, satsln-v4]
    env:
      APP_DIR: /www/wwwroot/pesats-v4.local

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy
        run: |
          set -Eeuo pipefail
          cd "$APP_DIR"

          git config --global --add safe.directory "$APP_DIR"
          git fetch origin main
          git reset --hard "$GITHUB_SHA"

          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

          npm ci
          npm run build

          # php-fpm (www) and this runner (henri) both write storage/ and bootstrap/cache/.
          sudo chown -R henri:www storage bootstrap/cache public/build
          sudo chmod -R ug+rwX,o-rwx storage bootstrap/cache public/build

          php artisan migrate --force
          php artisan storage:link || true
          php artisan optimize:clear
          # No route:cache (so not `artisan optimize`): the cached matcher strips the trailing slash
          # from REQUEST_URI, which breaks base-path detection for /satsln-v4/ and lands on the
          # {any} catch-all route ("Too few arguments to RoutingController::root()").
          php artisan config:cache
          php artisan event:cache
          php artisan view:cache
          sudo chown -R henri:www storage bootstrap/cache
          sudo chmod -R ug+rwX,o-rwx storage bootstrap/cache

      - name: Install & restart background services
        run: |
          set -Eeuo pipefail
          PHP_BIN="$(command -v php)"

          # name|artisan args. Default worker also drains "whatsapp" (SendWhatsAppNotificationJob).
          services=(
            "pesats-v4-queue|queue:work --queue=default,whatsapp --tries=3 --sleep=3"
            "pesats-v4-queue-notifications|queue:work --queue=notifications --tries=3 --sleep=1"
            "pesats-v4-reverb|reverb:start"
          )

          changed=0
          for entry in "${services[@]}"; do
            name="${entry%%|*}"
            args="${entry#*|}"
            unit="$(mktemp)"
            {
              echo "[Unit]"
              echo "Description=pesats-v4 ${args}"
              echo "After=network.target"
              echo
              echo "[Service]"
              echo "User=henri"
              echo "Group=www"
              echo "UMask=0007"
              echo "WorkingDirectory=${APP_DIR}"
              echo "ExecStart=${PHP_BIN} ${APP_DIR}/artisan ${args}"
              echo "Restart=always"
              echo "RestartSec=5"
              echo
              echo "[Install]"
              echo "WantedBy=multi-user.target"
            } > "$unit"
            if ! sudo cmp -s "$unit" "/etc/systemd/system/${name}.service"; then
              sudo install -m 0644 "$unit" "/etc/systemd/system/${name}.service"
              changed=1
            fi
            rm -f "$unit"
          done

          if [ "$changed" = 1 ]; then sudo systemctl daemon-reload; fi
          for entry in "${services[@]}"; do
            name="${entry%%|*}"
            sudo systemctl enable "${name}.service"
            # Restart picks up the new code/config (replaces `queue:restart` / `reverb:restart`).
            sudo systemctl restart "${name}.service"
          done

          sleep 3
          for entry in "${services[@]}"; do
            name="${entry%%|*}"
            sudo systemctl is-active --quiet "${name}.service" \
              || { sudo journalctl -u "${name}.service" -n 50 --no-pager; exit 1; }
          done

      - name: Smoke test
        run: |
          code=$(curl -sk -o /dev/null -w '%{http_code}' https://pesats.ksdae.kehutanan.go.id/satsln-v4/login)
          echo "GET /satsln-v4/login -> $code"
          test "$code" = "200"
